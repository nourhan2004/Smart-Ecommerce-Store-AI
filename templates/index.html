<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- ── Navbar ───────────────────────────── -->
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold fs-4" href="/">
      🛒 SmartStore
    </a>
    <span class="text-white-50 small">AI-Powered Recommendations</span>
  </nav>

  <!-- ── Hero ─────────────────────────────── -->
  <div class="hero-section text-center text-white py-5">
    <h1 class="fw-bold">Welcome to SmartStore</h1>
    <p class="lead">Discover products — get smart recommendations instantly</p>
  </div>

  <!-- ── Products Grid ─────────────────────── -->
  <div class="container py-5">
    <h2 class="mb-4 fw-bold">Our Products</h2>

    <div class="row g-4" id="products-grid">
      <!-- Cards injected by JS -->
    </div>
  </div>

  <!-- ── Footer ───────────────────────────── -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <small>SmartStore &copy; 2025 — Built by Mahmoud (Frontend)</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
