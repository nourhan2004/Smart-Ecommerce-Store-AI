<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- ── Navbar ───────────────────────────── -->
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold fs-4" href="index.html">
      🛒 SmartStore
    </a>
    <a href="index.html" class="btn btn-outline-light btn-sm">← Back</a>
  </nav>

  <!-- ── Product Detail ────────────────────── -->
  <div class="container py-5">
    <div class="row g-4 align-items-center" id="product-detail">
      <!-- Injected by JS -->
    </div>

    <!-- ── AI Recommendations ────────────── -->
    <div class="mt-5" id="recommendations-section" style="display:none;">
      <div class="d-flex align-items-center gap-2 mb-4">
        <span class="badge bg-primary fs-6 px-3 py-2">🤖 AI</span>
        <h4 class="mb-0 fw-bold">You May Also Like</h4>
      </div>

      <!-- Loading spinner -->
      <div id="rec-loading" class="text-center py-4" style="display:none;">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Finding recommendations...</p>
      </div>

      <div class="row g-3" id="recommendations-grid">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <!-- ── Footer ───────────────────────────── -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <small>SmartStore &copy; 2025 — Built by Mahmoud (Frontend)</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
